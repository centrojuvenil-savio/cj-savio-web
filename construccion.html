<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="La web del Centro Juvenil Savio está en construcción. Volvemos pronto."
    />
    <title>Web en construcción | Centro Juvenil Savio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;600;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="construction-body">
    <main class="construction-page">
      <img class="construction-logo construction-enter" src="assets/logo-inicio.png" alt="Centro Juvenil Savio" />
      <section class="construction-panel">
        <div class="construction-copy construction-enter">
          <p class="section-kicker">Web en construcción</p>
          <h1>Don Bosco nos está echando una mano.</h1>
          <p>
            Estamos actualizando la web del Centro Juvenil Savio para que vuelva pronto, más alegre y más fácil de usar.
          </p>
        </div>
        <div class="construction-art-wrap construction-enter">
          <img
            class="construction-art"
            src="assets/construccion-ilustracion.png"
            alt="Ilustración para la web en construcción"
          />
        </div>
      </section>
    </main>
  </body>
</html>
